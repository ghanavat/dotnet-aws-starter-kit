# This workflow will publish Nuget package to NuGet Org when a release created and published

name: Publish to NuGet Org

on:
  release:
    types: [ published ]

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build ./content/DotNetAws.StarterKit/Ghanavats.DotnetAws.sln --configuration Release
      - name: Pack
        run: dotnet pack Ghanavats.DotNetAws.Templates.csproj --configuration Release --no-build --no-restore --output .
      - name: Push to NuGet org
        run: dotnet nuget push "*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
